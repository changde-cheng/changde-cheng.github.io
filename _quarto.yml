project:
  type: website
  output-dir: docs
  render:
    - "*.qmd"
    - "*.Rmd"
    - "*.md"
  # Self-hosted KaTeX (see katex/README.md) -- copied into docs/ on every render.
  # Listed file-by-file rather than katex/** so the published surface stays exactly the
  # three things the browser asks for, and the README stays out of docs/.
  resources:
    - "katex/katex.min.js"
    - "katex/katex.min.css"
    - "katex/fonts/*.woff2"
  # Belt-and-braces: fails the build if any third-party script survives into docs/.
  post-render:
    - scripts/check_external_scripts.sh
  preview:
#    port: 1234
    browser: true

