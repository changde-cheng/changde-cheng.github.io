format:
  html:
    theme:
      - cosmo # safe
      # - journal # orange color
      #- cerulean
      # - zephyr # good, it is blue, though
      # - minty # too weak
      #- custom.scss
      - custom.scss.bk.scss
    # theme: cosmo #litera
    # css: styles.css
    # Math is rendered by the KaTeX vendored in katex/ -- NOT by the default MathJax,
    # which Quarto 1.3 pairs with a <script src="polyfill.io"> tag.  That domain was
    # taken over and served malware in June 2024.  See katex/README.md.
    html-math-method:
      method: katex
      url: /katex/


description-meta: "Explore computational cancer genomics research at Cheng Lab. We focus on multi-omics integration and analysis, tumor microenvironment studies, computational immunology, clonal evolution, and advancing personalized oncology through therapy optimization, drug development, and biomarker discovery."

